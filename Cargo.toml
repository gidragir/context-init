[package]
name = "context-init"
version = "0.1.0"
edition = "2021"
description = "CLI tool to initialize OpenViking hierarchical L0-L2 context for AI in any project"
authors = ["gidragir"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
colored = "2.1"
anyhow = "1.0"
