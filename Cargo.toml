[package]
name = "context-init"
version = "0.2.0"
edition = "2021"
description = "CLI tool to initialize OpenViking hierarchical L0-L2 context for AI in any project"
authors = ["gidragir"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
colored = "2.1"
anyhow = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
tiktoken-rs = "0.5"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1.0"

