name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: nextest
        run: cargo nextest run --workspace --no-fail-fast -E 'not binary(regression_benchmark)'
      - name: regression_benchmark
        run: cargo test --test regression_benchmark -- --nocapture

  neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No vendor-specific mentions in code, tests or docs
        shell: bash
        run: |
          if grep -rniE '1[cс]' crates src tests; then
            echo "neutrality invariant violated"; exit 1
          fi
