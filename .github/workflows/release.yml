# Builds and publishes binaries when release-plz pushes a `vX.Y.Z` tag (cargo-dist `dist` profile).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross toolchain (linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo install cross --locked
          fi
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --profile dist --target ${{ matrix.target }} --bin context-init
          else
            cargo build --profile dist --target ${{ matrix.target }} --bin context-init
          fi
      - name: Package
        shell: bash
        run: |
          name="context-init-${{ matrix.target }}"
          mkdir -p "$name"
          ext=""; [ "${{ matrix.os }}" = "windows-latest" ] && ext=".exe"
          cp "target/${{ matrix.target }}/dist/context-init$ext" "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: context-init-${{ matrix.target }}
          path: context-init-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  scoop:
    name: update scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gidragir/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Write manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/context-init-x86_64-pc-windows-msvc.tar.gz"
          cat > context-init.json <<JSON
          {
            "version": "$version",
            "description": "Hierarchical L0-L2 context for AI agents",
            "homepage": "https://github.com/${{ github.repository }}",
            "license": "MIT",
            "url": "$url",
            "bin": "context-init.exe",
            "extract_dir": "context-init-x86_64-pc-windows-msvc"
          }
          JSON
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add context-init.json
          git commit -m "context-init ${GITHUB_REF_NAME}" || exit 0
          git push
