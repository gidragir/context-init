# =============================================================================
# Lefthook Git Pre-Commit Configuration for context-init
# Focus: Rust syntax check and formatting (build/test/dist live in mise.toml)
# =============================================================================
pre-commit:
  parallel: false
  commands:
    check-rust:
      glob: "{src,crates}/**/*.rs"
      run: cargo check --workspace --quiet

    fmt-rust:
      glob: "{src,crates}/**/*.rs"
      run: cargo fmt --all
      stage_fixed: true
