# Единственный таск-раннер проекта (`mise run <task>`).
[tools]
rust = "stable"
"cargo:cargo-nextest" = "latest"

[tasks.build]
description = "Release build of the whole workspace"
run = "cargo build --workspace --release"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo nextest run --workspace"

[tasks.lint]
description = "clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
description = "Format all crates"
run = "cargo fmt --all"

[tasks.check]
description = "Knowledge-base drift check of this repository"
run = "cargo run --quiet -- check . --exit-code --compact"

[tasks.install]
description = "Build release binary and install it to ~/.local/bin atomically"
run = "mkdir -p ~/.local/bin && cargo build --release --bin context-init && install -m755 target/release/context-init ~/.local/bin/.context-init.new && mv ~/.local/bin/.context-init.new ~/.local/bin/context-init"

[tasks.dist]
description = "Build the distributable binary with the dist profile"
run = "cargo build --profile dist --bin context-init"

[tasks.audit]
description = "Regression benchmark (context-audit gate); writes reports with CONTEXT_INIT_WRITE_BENCHMARK=1"
env = { CONTEXT_INIT_WRITE_BENCHMARK = "1" }
run = "cargo test --test regression_benchmark -- --nocapture"

[tasks.audit-sessions]
description = "Audit transcripts for context-init adoption"
run = "python3 -I scripts/audit-sessions.py"

[tasks.probe-adoption]
description = "Adoption probe benchmark for Claude Code and Antigravity"
run = "bash scripts/probe-adoption.sh"
